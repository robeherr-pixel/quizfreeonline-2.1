<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participar · QuizFreeOnline 2.1</title><link rel="stylesheet" href="/style.css"></head><body><main class="audience"><section class="card audcard"><div class="audhead"><div class="brand"><div class="logo">Q</div>QuizFreeOnline</div><div><span class="badge">Participante</span><div id="name" class="namechip"></div></div></div><div id="content"><div class="empty">Conectando con la sesión…</div></div></section></main><script src="/socket.io/socket.io.js"></script><script>const id=new URLSearchParams(location.search).get('session'),socket=io(),saved=localStorage.getItem('qfo-name'),name=saved||prompt('Tu nombre (opcional):')||'Anónimo';let participantId=localStorage.getItem('qfo-participant-id');if(!participantId){participantId=(crypto.randomUUID?crypto.randomUUID():'p-'+Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem('qfo-participant-id',participantId)}localStorage.setItem('qfo-name',name);document.querySelector('#name').textContent=name;let q=null,lastQuestion=null;socket.on('connect',()=>socket.emit('join',{sessionId:id,role:'audience'}));socket.on('errorMessage',m=>document.querySelector('#content').innerHTML=`<div class="empty">${m}</div>`);socket.on('state',s=>{if(!s.question){q=null;document.querySelector('#content').innerHTML='<div class="eyebrow">Sesión en vivo</div><h1 class="audquestion">Espera un momento…</h1><p>El presentador todavía no ha activado una pregunta.</p>';return}q=s.question;if(lastQuestion!==q.id){lastQuestion=q.id;render()}});const esc=t=>String(t??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const attr=t=>String(t??'').replace(/"/g,'&quot;');function render(){document.querySelector('#content').innerHTML=`<div class="eyebrow">Pregunta en vivo</div><h1 class="audquestion">${esc(q.text)}</h1><form id="form">${q.options.map(o=>`<label class="option"><input type="${q.type==='multiple'?'checkbox':'radio'}" name="answer" value="${attr(o)}"><span>${esc(o)}</span></label>`).join('')}<button class="btn submit">Enviar respuesta</button></form>`;document.querySelector('#form').onsubmit=e=>{e.preventDefault();const vals=[...e.target.querySelectorAll('input:checked')].map(x=>x.value);if(!vals.length)return;socket.emit('answer',{sessionId:id,questionId:q.id,participant:name,participantId,answer:q.type==='multiple'?vals:vals[0]});e.target.innerHTML='<div class="success"><h2>¡Respuesta guardada!</h2><p>Si el presentador vuelve a esta pregunta, puedes cambiarla: se actualizará sin duplicarse.</p></div>'}}</script></body></html>
